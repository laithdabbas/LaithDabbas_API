version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-rag-api
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - app-network
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr-rag-frontend
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://api:8000
    command: ["python", "app/demo.py"]
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
